name: Refresh weekly conference and arXiv catalogs

on:
  schedule:
    # 02:00 UTC is 10:00 Asia/Shanghai.
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-catalog-weekly-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the checked-out branch tip
        shell: bash
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Restore an interrupted arXiv harvest
        uses: actions/cache/restore@v4
        with:
          path: data/arxiv_recent.sync.tmp
          key: arxiv-sync-main-${{ github.run_id }}
          restore-keys: |
            arxiv-sync-main-

      - name: Refresh the rolling five-year conference census
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if python scripts/sync_conference_census.py; then
              exit 0
            fi
            echo "Conference harvest attempt ${attempt} failed; retrying in 60 seconds."
            sleep 60
          done
          exit 1

      - name: Refresh the rolling three-year cs.RO census
        id: harvest
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if python scripts/sync_arxiv_recent.py; then
              exit 0
            fi
            echo "Harvest attempt ${attempt} was interrupted; resuming from its page cache in 180 seconds."
            sleep 180
          done
          exit 1

      - name: Preserve the completed source snapshots
        if: ${{ steps.harvest.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: paper-sources-${{ github.run_id }}
          path: |
            data/papers.json
            data/arxiv_recent.json
          retention-days: 2
          compression-level: 9

      - name: Save an interrupted arXiv harvest
        if: ${{ always() && hashFiles('data/arxiv_recent.sync.tmp') != '' }}
        uses: actions/cache/save@v4
        with:
          path: data/arxiv_recent.sync.tmp
          key: arxiv-sync-main-${{ github.run_id }}

      - name: Rebuild generated catalogs
        run: python scripts/render_catalog.py

      - name: Audit data, taxonomy, generated pages, and links
        shell: bash
        run: |
          python scripts/audit_catalog.py
          python scripts/apply_taxonomy.py --check
          python scripts/render_catalog.py --check
          python scripts/check_local_links.py
          python -m unittest discover -s tests -v
          git diff --check

      - name: Commit and push a complete snapshot
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No catalog change to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh weekly paper snapshots $(date -u +%F)"
          git push origin HEAD:main
