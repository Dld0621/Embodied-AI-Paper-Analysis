        <path d="M0 40h326" stroke="#e6e8ec"/>
      </g>
      <g transform="translate(0 174)">
        <circle cx="8" cy="15" r="8" fill="#e9efff" stroke="#2558d9"/><circle cx="8" cy="15" r="3" fill="#2558d9"/>
        <text x="28" y="8" fill="#101217" font-size="8" font-weight="700">Dexterous Tactile Manipulation</text><text x="28" y="21" fill="#7b8492" font-size="6">Dexterity &amp; Teleoperation · 2025 · RSS</text><circle cx="278" cy="10" r="3" fill="#2558d9"/><text x="286" y="13" fill="#697386" font-size="6">Official</text>
