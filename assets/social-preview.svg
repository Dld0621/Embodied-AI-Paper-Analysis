    <text x="26" y="34" fill="#6b7380" font-size="10" font-weight="700" letter-spacing="1.4">RESEARCH INDEX</text>
  </g>

  <text x="76" y="202" fill="#697386" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="760" letter-spacing="2.4">CONFERENCE + ARXIV · TWO EVIDENCE LAYERS</text>
  <text x="76" y="285" fill="#101217" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="68" font-weight="700" letter-spacing="-3">Research the field.</text>
  <text x="76" y="356" fill="#2558d9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="68" font-weight="700" letter-spacing="-3">Not the feed.</text>
  <text x="76" y="411" fill="#697386" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Enter any direction · compare · save · export</text>

  <g transform="translate(76 474)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect width="530" height="88" rx="15" fill="#fff" stroke="#dfe3e9"/>
