        <text x="28" y="8" fill="#101217" font-size="8" font-weight="700">World Models for Robot Control</text><text x="28" y="21" fill="#7b8492" font-size="6">Perception &amp; World Models · 2024 · NeurIPS</text><circle cx="278" cy="10" r="3" fill="#b86912"/><text x="286" y="13" fill="#697386" font-size="6">Index</text>
