      <g transform="translate(0 150)" fill="#697386" font-size="7"><text x="11" y="16">RSS</text><text x="65" y="16">CoRL</text><text x="11" y="46">ICRA</text><text x="65" y="46">IROS</text></g>
      <text y="233" fill="#8a93a0" font-size="7" font-weight="700">SOURCE TIER</text>
