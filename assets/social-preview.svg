      <path d="M112 0v47" stroke="#e2e5ea"/>
      <text x="135" y="22" fill="#101217" font-size="23" font-weight="720">3,724</text><text x="135" y="44" fill="#7b8492" font-size="11">conference</text>
      <path d="M244 0v47" stroke="#e2e5ea"/>
      <text x="267" y="22" fill="#b31b1b" font-size="23" font-weight="720">23.8K</text><text x="267" y="44" fill="#7b8492" font-size="11">recent arXiv</text>
      <path d="M378 0v47" stroke="#e2e5ea"/>
      <text x="401" y="22" fill="#101217" font-size="23" font-weight="720">7</text><text x="401" y="44" fill="#7b8492" font-size="11">directions</text>
