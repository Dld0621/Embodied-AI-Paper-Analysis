<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Embodied AI Research Workbench</title>
  <desc id="desc">A bilingual research interface for 25,877 unique records across a five-year conference census and a rolling three-year arXiv robotics layer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8fa"/>
      <stop offset="1" stop-color="#eef1f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#121826" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect width="1280" height="640" rx="30" fill="url(#bg)"/>
  <g opacity=".55" stroke="#dfe3e9">
    <path d="M0 92h1280M0 184h1280M0 276h1280M0 368h1280M0 460h1280M0 552h1280"/>
    <path d="M160 0v640M320 0v640M480 0v640M640 0v640M800 0v640M960 0v640M1120 0v640"/>
  </g>

  <g transform="translate(76 66)" font-family="Inter,Segoe UI,Arial,sans-serif">
